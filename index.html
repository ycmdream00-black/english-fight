*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;}
body{min-height:100vh;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{max-width:520px;margin:0 auto;padding:14px 14px 90px;min-height:100vh}
.jua,h1,h2,h3,.big{font-family:"Jua",-apple-system,sans-serif;font-weight:400}
h1{font-size:26px;margin:4px 0}
h2{font-size:21px;margin:18px 0 8px}
h3{font-size:18px;margin:12px 0 6px}
.sub{color:var(--sub);font-size:14px}

.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.center{text-align:center}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:20px;font-family:"Jua",sans-serif;color:#1a1640;background:var(--gold);box-shadow:0 5px 0 #b8901a;margin:10px 0;cursor:pointer}

.btn.small{font-size:16px;padding:11px}

.banner{background:#5b3a00;color:#ffe2a8;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:8px}

.tabs button{flex:1;max-width:130px;background:none;border:0;color:var(--sub);padding:9px 0 12px;font-size:12px}
.tabs button b{display:block;font-size:22px;font-weight:400}
.tabs button.on{color:var(--gold)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.pl{background:var(--bg2);border-radius:16px;padding:12px 6px;text-align:center;border:3px solid transparent}
.pl.dad{border-color:var(--dad)} .pl.son{border-color:var(--son)}
.pl .emo{font-size:42px;line-height:1.1}
.pl .nm{font-family:"Jua";font-size:19px}
.pl .st{font-size:13px;color:var(--sub);margin-top:4px}

.vsmark{font-family:"Jua";font-size:28px;color:var(--accent)}
.crown{font-size:26px;display:block;height:30px}
.count{font-family:"Jua";font-size:24px;color:var(--gold)}
.pill{display:inline-block;background:var(--card2);border-radius:99px;padding:3px 10px;font-size:12px;margin:2px}

.typetag{background:var(--accent);color:#fff;border-radius:99px;padding:4px 12px;font-size:15px}
.timer{height:14px;background:#0e0c2b;border-radius:99px;overflow:hidden;margin:10px 0}
.timer>div{height:100%;background:linear-gradient(90deg,var(--ok),var(--gold));border-radius:99px;transform-origin:left}
.timer.hurry>div{background:var(--bad)}
.combo{text-align:center;font-family:"Jua";color:#ff8a3d;font-size:18px;animation:pop .4s}
.prompt{font-family:"Jua";font-size:40px;text-align:center;margin:22px 0 6px;word-break:break-all}
.prompt.ko{font-size:32px}
.hint{text-align:center;color:var(--sub);font-size:15px;margin-bottom:12px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{border:0;border-radius:16px;background:var(--card2);color:var(--txt);font-size:21px;padding:16px 10px;box-shadow:0 5px 0 #1d1950;font-family:"Jua",sans-serif}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #1d1950}
.opt.good{background:var(--ok);color:#06291a}
.opt.badc{background:var(--bad)}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.ox .opt{font-size:54px;padding:20px 0}

.slot.f{background:#fff;color:#1a1640;border-color:#ccc}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{width:48px;height:52px;border-radius:12px;border:0;background:var(--gold);color:#1a1640;font-family:"Jua";font-size:28px;box-shadow:0 4px 0 #b8901a}
.tile:disabled{opacity:.15}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.kb .r{display:flex;justify-content:center;gap:4px}
.kb button{flex:1;max-width:44px;height:48px;border:0;border-radius:8px;background:var(--card2);color:var(--txt);font-size:20px;font-family:"Jua";box-shadow:0 3px 0 #1d1950}
.kb button.wide{max-width:84px;flex:2;font-size:16px}
.kb button.go{background:var(--ok);color:#06291a}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.match .col{display:grid;gap:10px}
.mi{border:0;border-radius:14px;padding:14px 6px;font-size:19px;background:var(--card2);color:var(--txt);font-family:"Jua";box-shadow:0 4px 0 #1d1950;min-height:58px}
.mi.sel{background:var(--accent)}
.mi.done{background:var(--ok);color:#06291a;opacity:.55}
.mi.err{background:var(--bad)}
.shake{animation:shake .35s}

.overlay .ans{font-size:20px;margin-top:10px;color:var(--sub)}

const KST_FMT = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
function kst(d = new Date()) { const p = {}; KST_FMT.formatToParts(d).forEach(x => p[x.type] = x.value); return p; }
function todayKey() { const p = kst(); return `${p.year}-${p.month}-${p.day}`; }
const ymd = k => k.split("-").map(Number);
function dateAdd(k, n) { const [y, m, d] = ymd(k); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function dayDiff(a, b) { const [y1, m1, d1] = ymd(a), [y2, m2, d2] = ymd(b); return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 864e5); }
function kstTime(k, hour) { const [y, m, d] = ymd(k); return Date.UTC(y, m - 1, d, hour - 9, 0, 0); }
function weekStart(k) { const [y, m, d] = ymd(k); const dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); return dateAdd(k, -((dow + 6) % 7)); }
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
function prettyDate(k) { const [y, m, d] = ymd(k); return `${m}/${d}(${DOW[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]})`; }
function now() { return Date.now(); }
function revealAt(k) { return kstTime(k, CONFIG.resultHour); }
function isRevealed(k) { return LS.get("duel-reveal-now", false) && DEMO_OR_TEST() ? true : now() >= revealAt(k); }

function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = hashStr(seed); return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const parseW = (raw, adv) => raw.trim().split("\n").map(l => { const [w, m, s] = l.split("|").map(x => x.trim()); return { w, m, s, adv }; });
const WORDS = parseW(WORDS_RAW, 0).concat(parseW(WORDS_ADV_RAW, 1));
const WMAP = Object.fromEntries(WORDS.map(x => [x.w, x]));
const ORDER = shuffle(WORDS.filter(x => !x.adv).map(x => x.w), rng("word-order-v1"));
const ORDER_ADV = shuffle(WORDS.filter(x => x.adv).map(x => x.w), rng("word-order-adv-v1"));
const ALL_ORDER = ORDER.concat(ORDER_ADV);
function mTokens(m) { return m.replace(/\([^)]*\)/g, "").split(/[,·\/]/).map(t => t.replace(/[~\s]/g, "")).filter(Boolean); }
function overlap(a, b) { const A = mTokens(a), B = mTokens(b); return A.some(x => B.some(y => x === y || (x.length >= 2 && y.length >= 2 && (x.includes(y) || y.includes(x))))); }
function blankOut(s, w) { return s.replace(new RegExp("\\b" + w + "\\b", "i"), "_____"); }

       types: ["listen", "word", "boss", "blank", "match", "puzzle", "boss", "listen", "blank", "boss", "puzzle", "boss"] }
};
const lvOf = x => LEVELS[x] ? +x : 2;
const TYPE_LABEL = { ox: "⚡ 스피드 O/X", meaning: "🧠 뜻 고르기", word: "🔤 단어 고르기", listen: "🎧 듣고 고르기", puzzle: "🧩 철자 퍼즐", blank: "📝 빈칸 채우기", match: "🔗 짝 맞추기", boss: "👾 보스 (점수 2배)" };

function dayWords(date, review, lv) {
  const L = LEVELS[lv];
  const r = rng("day|" + date + "|" + CONFIG.room + "|" + lv);
  const N = ORDER.length, NA = ORDER_ADV.length, n = CONFIG.newWordsPerDay, k = Math.min(n, L.adv);
  const di = Math.max(0, dayDiff(CONFIG.startDate, date));
  const fresh = [];
  for (let i = 0; i < n - k; i++) fresh.push(ORDER[(di * n + i) % N]);
  for (let i = 0; i < k; i++) fresh.push(ORDER_ADV[(di * n + i) % NA]);
  let rv = shuffle([...new Set(review || [])].filter(w => WMAP[w] && !fresh.includes(w)).sort(), r).slice(0, CONFIG.reviewWordsPerDay);
  const learned = Math.min(di * n, N);
  const learnedPool = (learned >= 8 ? ORDER.slice(0, learned) : ORDER).concat(k ? ORDER_ADV.slice(0, Math.max(16, Math.min(di * n, NA))) : []);
  const pool = shuffle(learnedPool.filter(w => !fresh.includes(w) && !rv.includes(w)), r);
  const filled = [];
  while (rv.length + filled.length < CONFIG.reviewWordsPerDay && pool.length) filled.push(pool.shift());
  return { fresh, review: rv, extra: filled, r };
}

function pickDistractors(target, n, r, exclude = []) {
  const t = WMAP[target]; const out = [];
  for (const w of shuffle(ALL_ORDER, r)) {
    if (out.length >= n) break;
    if (w === target || exclude.includes(w) || out.includes(w)) continue;
    if (overlap(WMAP[w].m, t.m)) continue;
    if (out.some(o => overlap(WMAP[o].m, WMAP[w].m))) continue;
    out.push(w);
  }
  return out;
}
function pickSoundAlike(target, n, r) {
  const t = WMAP[target];
  const near = shuffle(ALL_ORDER.filter(w => w !== target && w[0] === target[0] && Math.abs(w.length - target.length) <= 3 && !overlap(WMAP[w].m, t.m)), r).slice(0, n);
  return near.length >= n ? near : near.concat(pickDistractors(target, n - near.length, r, near));
}

function buildQuiz(date, plan) {
  const lv = lvOf(plan.level), TYPES = LEVELS[lv].types;
  const { fresh, review, extra, r } = dayWords(date, plan.review, lv);
  const all = [...fresh, ...review, ...extra];
  let pool = shuffle(all, r);
  const shortSlots = TYPES.map((t, i) => (t === "puzzle" || t === "boss") ? i : -1).filter(i => i >= 0);
  const shorts = pool.filter(w => w.length >= 4 && w.length <= (lv >= 4 ? 10 : 8)).slice(0, shortSlots.length);
  const assign = new Array(TYPES.length);
  shortSlots.forEach((s, i) => { if (shorts[i]) assign[s] = shorts[i]; });
  const rest = pool.filter(w => !assign.includes(w));
  for (let i = 0; i < TYPES.length; i++) if (!assign[i]) assign[i] = rest.shift() || pool[i % pool.length];
  const qs = TYPES.map((type, i) => makeQ(type, assign[i], r, all, lv));
  return { date, lv, study: LEVELS[lv].study, fresh, review: [...review, ...extra], qs };
}

function makeQ(type, w, r, dayPool, lv) {
  const t = WMAP[w], L = LEVELS[lv], hard = lv >= 3;
  const q = { type, w, limit: 10 };
  const engOpts = () => shuffle([w, ...(hard ? pickSoundAlike(w, 3, r) : pickDistractors(w, 3, r))], r);
  if (type === "ox") {
    q.limit = 6; q.truth = r() < 0.5;
    q.shown = q.truth ? t.m : WMAP[pickDistractors(w, 1, r)[0]].m;
  } else if (type === "meaning") {
    q.limit = 10; q.opts = shuffle([w, ...pickDistractors(w, 3, r)], r).map(x => WMAP[x].m); q.ans = t.m;
  } else if (type === "word") {
    q.limit = 10; q.opts = engOpts(); q.ans = w;
  } else if (type === "listen") {
    q.limit = 12;
    if (hard) { q.meaningMode = true; q.opts = shuffle([w, ...pickDistractors(w, 3, r)], r).map(x => WMAP[x].m); q.ans = t.m; }
    else { q.opts = shuffle([w, ...pickSoundAlike(w, 3, r)], r); q.ans = w; }
  } else if (type === "blank") {
    q.limit = 15; q.sent = blankOut(t.s, w); q.opts = engOpts(); q.ans = w;
  } else if (type === "puzzle") {
    q.limit = Math.round(12 + w.length * 2 + L.decoy * 2);
    const letters = w.split("");
    for (let i = 0; i < L.decoy; i++) letters.push("aeioulnrst"[Math.floor(r() * 10)]);
    let tiles = letters; let tries = 0;
    do { tiles = shuffle(letters, r); tries++; } while (tiles.join("").startsWith(w) && tries < 10 && w.length > 1);
    q.tiles = tiles;
  } else if (type === "match") {
    q.limit = 25;
    const others = pickDistractors(w, 3, r, []).filter(Boolean);
    const fromDay = shuffle(dayPool.filter(x => x !== w && !overlap(WMAP[x].m, t.m)), r);
    const chosen = [w];
    for (const x of [...fromDay, ...others]) { if (chosen.length >= 4) break; if (!chosen.some(c => overlap(WMAP[c].m, WMAP[x].m))) chosen.push(x); }
    q.left = shuffle(chosen, r); q.right = shuffle(chosen, r);
  } else if (type === "boss") {
    q.limit = Math.round(10 + w.length * 1.6); q.firstHint = lv <= 3;
  }
  q.limit = Math.max(4, Math.round(q.limit * L.time));
  return q;
}

function beep(freqs, dur = 0.12, type = "sine", vol = 0.15) {

  } catch (e) {}
}

function outcome(date) {
  const d = resOf(date, "dad"), s = resOf(date, "son");
  const dd = d && d.status === "done" ? d : null, sd = s && s.status === "done" ? s : null;
  if (!dd && !sd) return { winner: null, dad: d, son: s, none: true };
  if (dd && !sd) return { winner: "dad", dad: d, son: s, forfeit: true };
  if (sd && !dd) return { winner: "son", dad: d, son: s, forfeit: true };
  const a = total(dd), b = total(sd);
  if (a !== b) return { winner: a > b ? "dad" : "son", dad: d, son: s };
  if (dd.timeMs !== sd.timeMs) return { winner: dd.timeMs < sd.timeMs ? "dad" : "son", dad: d, son: s, byTime: true };
  return { winner: "draw", dad: d, son: s };
}
function revealedDates() {

function standing(dates) {
  const st = { dad: { w: 0, l: 0, dr: 0, pts: 0 }, son: { w: 0, l: 0, dr: 0, pts: 0 }, days: 0 };
  for (const d of dates) {
    const o = outcome(d); if (o.none) continue; st.days++;
    PIDS.forEach(p => { const x = resOf(d, p); if (x && x.status === "done") st[p].pts += total(x); });
    if (o.winner === "draw") { st.dad.dr++; st.son.dr++; }
    else { st[o.winner].w++; st[other(o.winner)].l++; }
  }
  const sc = p => st[p].w + st[p].dr * 0.5;
  st.leader = st.days === 0 ? null : sc("dad") !== sc("son") ? (sc("dad") > sc("son") ? "dad" : "son") : st.dad.pts !== st.son.pts ? (st.dad.pts > st.son.pts ? "dad" : "son") : "draw";
  return st;
}
function streak(p) {
  let d = todayKey(), n = 0;
  const done = k => { const x = resOf(k, p); return x && x.status === "done"; };
  if (!done(d)) d = dateAdd(d, -1);
  while (done(d)) { n++; d = dateAdd(d, -1); }
  return n;
}

/* ===================== 게임 진행 ===================== */
const progKey = d => `duel-prog-${d}-${S.me}`;
const resPath = (d, p) => `results/${d}_${p}`;

async function getPlan(date) {
  let plan = await DB.get("plans/" + date);
  if (plan) return plan;
  const y = dateAdd(date, -1);
  const prev = await Promise.all(PIDS.map(p => DB.get(resPath(y, p))));
  const review = [...new Set(prev.filter(Boolean).flatMap(x => x.wrongWords || []))].sort();
  plan = { date, review, level: lvOf((S.settings && S.settings.level) || CONFIG.defaultLevel), createdBy: S.me, createdAt: now() };
  await DB.set("plans/" + date, plan);
  return plan;
}

async function startGame(resume) {
  const date = todayKey();
  if (!resume && !isOpen(date)) { toast("오늘 대결은 마감됐어요"); return; }
  app.innerHTML = `<div class="center" style="padding-top:120px"><div class="cd" style="font-size:60px">📚</div><div class="sub">오늘의 문제 준비 중...</div></div>`;
  let plan;
  try { plan = await getPlan(date); } catch (e) { toast("문제를 불러오지 못했어요: " + e.message); S.game = null; render(); return; }
  const quiz = buildQuiz(date, plan);
  let prog = LS.get(progKey(date), null);
  if (prog && prog.done) { toast("오늘은 이미 끝냈어요!"); S.game = null; await loadAll(); render(); return; }
  if (!prog) {
    const remote = await DB.get(resPath(date, S.me)).catch(() => null);
    if (remote && remote.status === "done") { toast("오늘은 이미 끝냈어요!"); await loadAll(); render(); return; }
    if (remote && remote.status === "playing") prog = { idx: remote.answers.length, answers: remote.answers, score: remote.score, combo: 0, maxCombo: remote.maxCombo || 0, startedAt: remote.startedAt, studied: true };
  }
  S.game = { date, quiz, qs: quiz.qs, idx: 0, answers: [], score: 0, combo: 0, maxCombo: 0, startedAt: now(), phase: "study" };
  if (prog && !prog.done) {
    Object.assign(S.game, { idx: prog.idx, answers: prog.answers, score: prog.score, combo: 0, maxCombo: prog.maxCombo || 0, startedAt: prog.startedAt });
    if (prog.inQ != null && prog.inQ === prog.idx) {
      recordAnswer({ ok: false, ms: S.game.qs[prog.idx].limit * 1000, pts: 0, left: true, wrongs: [S.game.qs[prog.idx].w] }, true);
      toast("나갔던 문제는 오답 처리됐어요 😅");
    }
    if (S.game.idx >= S.game.qs.length) return finishGame();
    if (prog.studied) return countdown();
  }
  showStudy();
}

function showStudy() {
  const g = S.game; g.phase = "study";
  const SEC = g.quiz.study || CONFIG.studySeconds;
  const end = now() + SEC * 1000;
  app.innerHTML = `<div class="qtop"><span>📖 오늘의 단어 외우기</span><span class="count" id="st">${SEC}</span></div>
  <div class="timer"><div id="tbar" style="width:100%"></div></div>
  <div class="sub">새 단어 ${g.quiz.fresh.length}개 + 복습 ${g.quiz.review.length}개. 🔊를 눌러 발음도 들어 보세요!</div>
  ${g.quiz.fresh.map(w => wordCard(w, WMAP[w].adv ? "NEW·중2~3" : "NEW")).join("")}${g.quiz.review.map(w => wordCard(w, "복습")).join("")}
  <button class="btn" data-act="ready" style="position:sticky;bottom:10px">다 외웠어! 시작 →</button>`;
  clearInterval(g.tick);
  g.tick = setInterval(() => {
    const left = end - now(); const el = document.getElementById("st"), bar = document.getElementById("tbar");
    if (el) el.textContent = Math.ceil(Math.max(0, left) / 1000); if (bar) bar.style.width = Math.max(0, left / (SEC * 10)) + "%";
    if (left <= 0) { clearInterval(g.tick); countdown(); }
  }, 200);
}

async function countdown() {
  const g = S.game; clearInterval(g.tick); g.phase = "count";
  saveProg({ studied: true });
  if (g.idx === 0 && !g.answers.length) DB.set(resPath(g.date, S.me), partialDoc()).catch(() => {});
  for (const n of ["3", "2", "1", "GO!"]) {
    app.innerHTML = `<div class="overlay"><div class="cd">${n}</div><div class="sub">문제마다 제한 시간이 있어요. 앱을 나가면 오답!</div></div>`;
    beep([n === "GO!" ? 1046 : 660], .12);
    await new Promise(r => setTimeout(r, 700));
  }
  showQ();
}

function partialDoc() {
  const g = S.game;
  return { player: S.me, date: g.date, status: "playing", answers: g.answers, score: g.score, maxCombo: g.maxCombo, startedAt: g.startedAt, wrongWords: wrongList() };
}
function wrongList() { return [...new Set(S.game.answers.flatMap(a => a.wrongs || []))]; }
function saveProg(extra = {}) { const g = S.game; const cur = LS.get(progKey(g.date), {}) || {}; LS.set(progKey(g.date), Object.assign(cur, { idx: g.idx, answers: g.answers, score: g.score, maxCombo: g.maxCombo, startedAt: g.startedAt }, extra)); }

function showQ() {
  const g = S.game, q = g.qs[g.idx];
  g.phase = "q"; g.qStart = now(); g.locked = false; g.pz = []; g.kb = ""; g.mm = { sel: null, done: [], mistakes: 0, wrongs: [] };
  saveProg({ inQ: g.idx });
  const head = `<div class="qtop"><span>Q${g.idx + 1}/${g.qs.length}</span><span class="typetag">${(q.meaningMode ? "🎧 듣고 뜻 고르기" : TYPE_LABEL[q.type])}</span><span>⭐${g.score}</span></div>
  <div class="timer" id="tw"><div id="tbar" style="width:100%"></div></div>${g.combo >= 2 ? `<div class="combo">🔥 ${g.combo} 콤보!</div>` : ""}`;
  let body = "";
  const t = WMAP[q.w];
  if (q.type === "ox") body = `<div class="prompt">${esc(q.w)}</div><div class="center jua" style="font-size:22px">=</div><div class="prompt ko">${esc(q.shown)}</div><div class="hint">맞으면 O, 틀리면 X!</div><div class="ox"><button class="opt" data-act="ox" data-v="1">⭕</button><button class="opt" data-act="ox" data-v="0">❌</button></div>`;
  else if (q.type === "meaning") body = `<div class="prompt">${esc(q.w)}</div><div class="hint">알맞은 뜻은?</div><div class="opts">${q.opts.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  else if (q.type === "word") body = `<div class="prompt ko">${esc(t.m)}</div><div class="hint">이 뜻의 영어 단어는?</div><div class="opts">${q.opts.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  else if (q.type === "listen") body = `<button class="speaker" data-act="sayq">🔊</button><div class="hint">${q.meaningMode ? "잘 듣고 그 단어의 <b>뜻</b>을 고르세요 (여러 번 들어도 OK)" : "잘 듣고 들린 단어를 고르세요 (여러 번 들어도 OK)"}</div><div class="opts">${q.opts.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  else if (q.type === "blank") body = `<div class="sentence">${esc(q.sent).replace("_____", "<u>_____</u>")}</div><div class="hint">빈칸에 들어갈 단어는?</div><div class="opts">${q.opts.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  else if (q.type === "puzzle") body = `<div class="prompt ko">${esc(t.m)}</div><div class="hint">글자를 순서대로 눌러 단어를 완성하세요 (칸을 누르면 지워져요)${q.tiles.length > q.w.length ? "<br>⚠️ 필요 없는 함정 글자가 섞여 있어요!" : ""}</div><div id="pzarea"></div>`;
  else if (q.type === "match") body = `<div class="hint" style="margin-top:12px">영어와 뜻을 짝지어 주세요! 틀리면 감점</div><div id="marea"></div>`;
  else if (q.type === "boss") body = `<div class="prompt ko">👾 ${esc(t.m)}</div><div class="hint">철자를 직접 입력! ${q.firstHint ? `첫 글자 <b>${esc(q.w[0])}</b> · ` : ""}${q.w.length}글자</div><div id="kbarea"></div>`;
  app.innerHTML = head + `<div id="qb">${body}</div>`;
  if (q.type === "puzzle") drawPuzzle();
  if (q.type === "match") drawMatch();
  if (q.type === "boss") drawKb();
  if (q.type === "listen") setTimeout(() => speak(q.w), 250);
  clearInterval(g.tick); let lastSec = 99;
  g.tick = setInterval(() => {
    const el = now() - g.qStart, left = q.limit * 1000 - el;
    const bar = document.getElementById("tbar"), tw = document.getElementById("tw");
    if (bar) bar.style.width = Math.max(0, left / (q.limit * 10)) + "%";
    if (tw && left < 3000) tw.classList.add("hurry");
    const sec = Math.ceil(left / 1000); if (sec <= 3 && sec < lastSec && sec > 0) { SFX.tick(); lastSec = sec; }
    if (left <= 0) timeUp();
  }, 100);
}

function timeUp() {
  const g = S.game, q = g.qs[g.idx]; if (g.locked) return;
  if (q.type === "match") { const n = g.mm.done.length; const wr = q.left.filter(w => !g.mm.done.includes(w)); return answer(false, { pts: n * 25, wrongs: [...new Set([...wr, ...g.mm.wrongs])], timeout: true }); }
  answer(false, { timeout: true });
}

function answer(ok, extra = {}) {
  const g = S.game, q = g.qs[g.idx]; if (g.locked) return; g.locked = true; clearInterval(g.tick);
  const ms = Math.min(now() - g.qStart, q.limit * 1000), remain = q.limit * 1000 - ms;
  let pts = extra.pts || 0, cb = 0;
  if (ok) {
    const base = extra.base ?? 100, mult = q.type === "boss" ? 2 : 1;
    pts = Math.round((base + speedBonus(remain, q.limit * 1000)) * mult);
    if (extra.keepCombo !== false) { g.combo++; cb = comboBonus(g.combo); } else g.combo = 0;
    pts += cb;
  } else g.combo = 0;
  g.maxCombo = Math.max(g.maxCombo, g.combo);
  recordAnswer({ ok, ms, pts, timeout: !!extra.timeout, left: !!extra.left, wrongs: ok ? (extra.wrongs || []) : (extra.wrongs || [q.w]) });
  if (ok) { SFX.ok(); } else { SFX.bad(); vibrate(150); }
  feedback(ok, pts, cb, extra);
}
function recordAnswer(a, silent) {
  const g = S.game, q = g.qs[g.idx];
  g.answers.push(Object.assign({ w: q.w, t: q.type }, a)); g.score += a.pts; g.idx++;
  saveProg({ inQ: null });
  DB.set(resPath(g.date, S.me), partialDoc()).catch(() => {});
}
function feedback(ok, pts, cb, extra) {
  const g = S.game, q = g.qs[g.idx - 1], t = WMAP[q.w];
  const msg = ok ? ["완벽해!", "좋아!", "정답!", "천재인데?", "나이스!"][Math.floor(Math.random() * 5)] : extra.left ? "앱을 나가서 오답!" : extra.timeout ? "시간 초과!" : "아깝다!";
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="huge">${ok ? "⭕" : extra.left ? "🚪" : extra.timeout ? "⏰" : "❌"}</div><div class="msg">${msg}${pts ? ` +${pts}` : ""}</div>${cb ? `<div class="combo">🔥 콤보 보너스 +${cb}</div>` : ""}
  <div class="ans"><b>${esc(q.w)}</b><br>${esc(t.m)}</div>${extra.left ? `<button class="btn" data-act="next" style="max-width:300px;margin-top:20px">계속하기</button>` : ""}`;
  document.body.appendChild(ov); g.phase = "fb"; g.ov = ov;
  if (!extra.left) g.fbTimer = setTimeout(nextQ, ok ? 900 : 1600);
}
function nextQ() {
  const g = S.game; if (!g) return; clearTimeout(g.fbTimer); if (g.ov) { g.ov.remove(); g.ov = null; }
  if (g.idx >= g.qs.length) finishGame(); else showQ();
}

/* --- 퍼즐 --- */
function drawPuzzle() {
  const g = S.game, q = g.qs[g.idx];
  document.getElementById("pzarea").innerHTML = `<div class="slots" id="slots">${q.w.split("").map((_, i) => `<div class="slot ${g.pz[i] != null ? "f" : ""}" data-act="pzundo">${g.pz[i] != null ? esc(q.tiles[g.pz[i]]) : ""}</div>`).join("")}</div>
  <div class="tiles">${q.tiles.map((c, i) => `<button class="tile" data-act="pz" data-i="${i}" ${g.pz.includes(i) ? "disabled" : ""}>${esc(c)}</button>`).join("")}</div>`;
}
function pzTap(i) {
  const g = S.game, q = g.qs[g.idx]; if (g.locked || g.pz.includes(i)) return;
  g.pz.push(i); beep([500 + g.pz.length * 60], .05);
  if (g.pz.length === q.w.length) {
    const word = g.pz.map(k => q.tiles[k]).join("");
    if (word === q.w) return answer(true);
    drawPuzzle(); const s = document.getElementById("slots"); s.classList.add("shake"); SFX.bad(); vibrate(80);
    setTimeout(() => { g.pz = []; if (!g.locked) drawPuzzle(); }, 450); return;
  }
  drawPuzzle();
}
/* --- 짝 맞추기 --- */
function drawMatch() {
  const g = S.game, q = g.qs[g.idx], m = g.mm;
  document.getElementById("marea").innerHTML = `<div class="match"><div class="col">${q.left.map(w => `<button class="mi ${m.done.includes(w) ? "done" : m.sel === w ? "sel" : ""}" data-act="mL" data-w="${esc(w)}" ${m.done.includes(w) ? "disabled" : ""}>${esc(w)}</button>`).join("")}</div>
  <div class="col">${q.right.map(w => `<button class="mi ${m.done.includes(w) ? "done" : ""}" data-act="mR" data-w="${esc(w)}" ${m.done.includes(w) ? "disabled" : ""} style="font-size:16px">${esc(WMAP[w].m)}</button>`).join("")}</div></div>`;
}
function matchTap(side, w, el) {
  const g = S.game, q = g.qs[g.idx], m = g.mm; if (g.locked) return;
  if (side === "L") { m.sel = w; beep([600], .04); return drawMatch(); }
  if (!m.sel) { toast("왼쪽 영어 단어를 먼저 골라요", 1200); return; }
  if (m.sel === w) {
    m.done.push(w); m.sel = null; beep([700, 900], .07);
    if (m.done.length === q.left.length) return answer(true, { base: Math.max(25, 100 - 25 * m.mistakes), keepCombo: m.mistakes === 0, wrongs: m.wrongs });
    drawMatch();
  } else {
    m.mistakes++; m.wrongs.push(m.sel); el.classList.add("err", "shake"); SFX.bad(); vibrate(80); m.sel = null;
    setTimeout(drawMatch, 400);
  }
}
/* --- 보스 키보드 --- */
function drawKb() {
  const g = S.game, q = g.qs[g.idx];
  const rows = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
  document.getElementById("kbarea").innerHTML = `<div class="slots" id="slots">${q.w.split("").map((_, i) => `<div class="slot ${g.kb[i] ? "f" : ""}">${esc(g.kb[i] || "")}</div>`).join("")}</div>
  <div class="kb">${rows.map((r, ri) => `<div class="r">${ri === 2 ? `<button class="wide" data-act="kbDel">⌫</button>` : ""}${r.split("").map(c => `<button data-act="kb" data-k="${c}">${c}</button>`).join("")}${ri === 2 ? `<button class="wide go" data-act="kbGo">확인</button>` : ""}</div>`).join("")}</div>`;
}
function kbKey(k) { const g = S.game, q = g.qs[g.idx]; if (g.locked) return; if (g.kb.length < q.w.length) g.kb += k; drawKb(); if (g.kb.length === q.w.length) kbGo(); }
function kbGo() {
  const g = S.game, q = g.qs[g.idx]; if (g.locked) return;
  if (g.kb.toLowerCase() === q.w.toLowerCase()) return answer(true);
  if (g.kb.length < q.w.length) { toast(`${q.w.length}글자를 채워 주세요`, 1200); return; }
  const s = document.getElementById("slots"); s && s.classList.add("shake"); SFX.bad(); vibrate(80);
  setTimeout(() => { g.kb = ""; if (!g.locked) drawKb(); }, 450);
}

/* --- 끝 --- */
async function finishGame() {
  const g = S.game; clearInterval(g.tick); g.phase = "done";
  const correct = g.answers.filter(a => a.ok).length, timeMs = g.answers.reduce((s, a) => s + a.ms, 0);
  const bonus = Number((S.settings && S.settings.bonus || {})[S.me]) || 0;
  const doc = { player: S.me, date: g.date, status: "done", score: g.score, bonus, correct, total: g.qs.length, timeMs, maxCombo: g.maxCombo, answers: g.answers, wrongWords: wrongList(), startedAt: g.startedAt, finishedAt: now() };
  app.innerHTML = `<div class="center" style="padding-top:100px"><div class="cd" style="font-size:60px">💾</div><div class="sub">결과 저장 중...</div></div>`;
  let saved = false;
  for (let i = 0; i < 3 && !saved; i++) { try { await DB.set(resPath(g.date, S.me), doc); saved = true; } catch (e) { await new Promise(r => setTimeout(r, 1500)); } }
  LS.set(progKey(g.date), { done: true });
  let oppDone = false;
  try { const o = await DB.get(resPath(g.date, other(S.me))); oppDone = !!(o && o.status === "done"); } catch (e) {}
  const me = P(S.me), opp = P(other(S.me));
  if (!oppDone) {
    await notify([other(S.me)], `${me.emoji} ${josa(me.name, "이", "가")} 다 풀었어!`, `오늘 영어 대결 끝! ${opp.name}도 빨리 도전해! 🔥 (마감 밤 ${HOUR_TXT})`, { tags: ["fire"], priority: 4 });
    if (isOpen(g.date)) await notify(PIDS, "🏆 오늘의 결과 발표!", "누가 이겼을까? 앱을 열어서 확인해 보세요 👀", { at: revealAt(g.date), tags: ["trophy"], priority: 4, silent: !DEMO });
  } else {
    await notify([other(S.me)], `${me.emoji} ${me.name}도 다 풀었어!`, `둘 다 끝! 결과는 밤 ${HOUR_TXT}에 공개돼요 🔒`, { tags: ["lock"] });
  }
  confetti(30); SFX.win();
  const wl = doc.wrongWords;
  app.innerHTML = `<div class="center" style="padding-top:24px"><div style="font-size:70px">🎉</div><h1>오늘 도전 완료!</h1>
  <div class="count" style="font-size:52px">${doc.score}점</div><div class="sub">정답 ${correct}/${g.qs.length} · ${fmtSec(timeMs)} · 최고 콤보 ${g.maxCombo}${bonus ? ` · 핸디캡 +${bonus}` : ""}</div></div>
  <div class="card center">${oppDone ? `📣 ${esc(opp.name)}에게 "나도 끝!" 알림을 보냈어요.<br>` : `📣 ${esc(opp.name)}에게 "빨리 풀어!" 알림을 보냈어요.<br>`}<b>결과는 오늘 밤 ${HOUR_TXT}에 공개!</b>${saved ? "" : `<br><span style="color:var(--bad)">⚠️ 서버 저장 실패 — 인터넷 연결 후 앱을 다시 열어 주세요</span>`}</div>
  <div class="card"><h3>📒 오늘의 오답노트</h3>${wl.length ? wl.map(w => wordCard(w)).join("") : `<div class="sub">하나도 안 틀렸어요! 🏅</div>`}</div>
  <button class="btn" data-act="home">홈으로</button>`;
  if (!saved) LS.set("duel-unsaved", doc);
  S.game = null; S.finishView = true;
  loadAll();
}

/* ===================== 이벤트 ===================== */
const ACT = {
  async pick(d) { S.me = d.p; LS.set("duel-me", d.p); await loadAll(); render(); },
  tab(d) { S.tab = d.k; S.detail = null; S.switchArm = false; render(); window.scrollTo(0, 0); },
  detail(d) { S.detail = d.d; render(); window.scrollTo(0, 0); },
  back() { S.detail = null; render(); },
  home() { S.game = null; S.finishView = false; S.tab = "home"; S.detail = null; render(); maybeCelebrate(); },
  start() { startGame(false); },
  resume() { startGame(true); },
  ready() { countdown(); },
  next() { nextQ(); },
  say(d) { speak(d.w); },
  sayq() { const g = S.game; speak(g.qs[g.idx].w); },
  ox(d) { const g = S.game, q = g.qs[g.idx]; if (g.locked) return; answer((d.v === "1") === q.truth); },
  opt(d, el) { const g = S.game, q = g.qs[g.idx]; if (g.locked) return; const ok = q.opts[+d.i] === q.ans; el.classList.add(ok ? "good" : "badc"); if (!ok) document.querySelectorAll(".opt").forEach((b, i) => { if (q.opts[i] === q.ans) b.classList.add("good"); }); answer(ok); },
  pz(d) { pzTap(+d.i); },
  pzundo() { const g = S.game; if (g.locked || !g.pz.length) return; g.pz.pop(); drawPuzzle(); },
  mL(d, el) { matchTap("L", d.w, el); },
  mR(d, el) { matchTap("R", d.w, el); },
  kb(d) { kbKey(d.k); },
  kbDel() { const g = S.game; if (g.locked) return; g.kb = g.kb.slice(0, -1); drawKb(); },
  kbGo() { kbGo(); },
  switch() { if (!S.switchArm) { S.switchArm = true; render(); return; } S.switchArm = false; S.me = other(S.me); LS.set("duel-me", S.me); render(); toast(`이제 ${P(S.me).emoji} ${P(S.me).name}(으)로 플레이해요`); },
  async lvl(d) {
    const st = Object.assign({}, S.settings, { level: +d.v });
    try { await DB.set("meta/settings", st); S.settings = st; toast(`난이도 ${d.v}단계로 바꿨어요`); } catch (e) { toast("저장 실패: " + e.message); }
    render();
  },
  sound() { LS.set("duel-sound", !LS.get("duel-sound", true)); render(); },
  async saveSet() {
    const st = Object.assign({}, S.settings, { dailyPrize: document.getElementById("pz-d").value.trim(), weeklyPrize: document.getElementById("pz-w").value.trim(), monthlyPrize: document.getElementById("pz-m").value.trim(), bonus: { dad: Math.max(0, +document.getElementById("bn-dad").value || 0), son: Math.max(0, +document.getElementById("bn-son").value || 0) } });
    try { await DB.set("meta/settings", st); S.settings = st; toast("저장했어요 ✅"); } catch (e) { toast("저장 실패: " + e.message); }
    render();
  },
  testPush() { notify([S.me], "🔔 테스트 알림", "알림이 잘 와요! 오늘도 영어 대결 화이팅 💪", { tags: ["bell"] }); toast("보냈어요. 몇 초 안에 알림이 와야 해요."); },
  revealNow() { LS.set("duel-reveal-now", !LS.get("duel-reveal-now", false)); render(); },
  async fakeOpp() { const d = todayKey(), p = other(S.me); const correct = 7 + Math.floor(Math.random() * 6); await DB.set(resPath(d, p), fakeDoc(d, p, correct)); await loadAll(); render(); toast(`${P(p).name} 기록을 만들었어요`); },
  async resetToday() { const d = todayKey(); await DB.del(resPath(d, S.me)); LS.del(progKey(d)); await loadAll(); render(); toast("오늘 내 기록을 지웠어요"); },
  async fakeWeek() { const d = todayKey(); for (let i = 1; i <= 14; i++) { const k = dateAdd(d, -i); for (const p of PIDS) if (Math.random() < 0.92) await DB.set(resPath(k, p), fakeDoc(k, p, 6 + Math.floor(Math.random() * 7))); } await loadAll(); render(); toast("지난 2주 기록을 만들었어요"); }
};
function fakeDoc(d, p, correct) {
  const words = shuffle(ORDER, rng(d + p)).slice(0, 12 - correct);
  const score = correct * 130 + Math.floor(Math.random() * 200);
  return { player: p, date: d, status: "done", score, bonus: 0, correct, total: 12, timeMs: 60000 + Math.floor(Math.random() * 90000), maxCombo: Math.min(correct, 5), answers: [], wrongWords: words, finishedAt: now(), fake: true };
}
document.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (!t || t.disabled) return; const f = ACT[t.dataset.act]; if (f) f(t.dataset, t); });

/* 앱을 벗어나면 그 문제는 오답 */
document.addEventListener("visibilitychange", async () => {
  const g = S.game;
  if (document.hidden) { if (g && g.phase === "q" && !g.locked) answer(false, { left: true }); return; }
  if (!g && !S.finishView && S.tab !== "set") { await loadAll(); render(); maybeCelebrate(); }
});

/* 홈 화면 카운트다운 + 주기적 새로고침 */
setInterval(() => { const el = document.getElementById("cd"); if (el && !S.game) { const left = revealAt(todayKey()) - now(); if (left <= 0) { loadAll().then(() => { render(); maybeCelebrate(); }); } else el.textContent = fmtDur(left); } }, 1000);
setInterval(() => { if (!S.game && !S.finishView && S.tab !== "set" && !document.hidden && S.me) loadAll().then(() => { if (!S.game) { const y = window.scrollY; render(); window.scrollTo(0, y); } }); }, 45000);

/* 저장 못한 기록 재전송 */
async function flushUnsaved() { const u = LS.get("duel-unsaved", null); if (!u) return; try { await DB.set(resPath(u.date, u.player), u); LS.del("duel-unsaved"); } catch (e) {} }

/* 결과 발표 순간 축하 */
let celebrated = LS.get("duel-celebrated", "");
function maybeCelebrate() { const d = todayKey(); if (celebrated === d || !isRevealed(d)) return; const o = outcome(d); if (o.none) return; celebrated = d; LS.set("duel-celebrated", d); if (o.winner === S.me) { confetti(60); SFX.win(); toast("👑 오늘은 내가 이겼다!"); } else if (o.winner === "draw") toast("🤝 오늘은 무승부!"); else toast(`${P(o.winner).emoji} 오늘은 ${josa(P(o.winner).name, "이", "가")} 이겼어요. 내일 설욕전!`); }

(async function init() {
  if ("serviceWorker" in navigator && location.protocol === "https:") { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {} }
  if (!S.me) return renderPick();
  app.innerHTML = `<div class="center" style="padding-top:140px"><div style="font-size:60px">⚔️</div><div class="sub">불러오는 중...</div></div>`;
  await flushUnsaved(); await loadAll(); render(); maybeCelebrate();
})();
</script>
